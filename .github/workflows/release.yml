# Uploads a release to the Maven Central Portal when a version tag (e.g. 0.1.0) is pushed.
# The deployment is NOT published automatically: review it at
# https://central.sonatype.com/publishing/deployments and click "Publish" (versions can't be deleted).
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      # Also validates the Gradle wrapper JAR checksum.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Check the tag matches Renoo.SDK_VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -nE 's/.*SDK_VERSION: String = "([^"]+)".*/\1/p' renoo/src/main/kotlin/dev/renoo/sdk/Renoo.kt)
          if [ "$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match Renoo.SDK_VERSION $version"
            exit 1
          fi

      - name: Test
        run: ./gradlew :renoo:testDebugUnitTest

      - name: Build, sign and upload to the Central Portal
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :renoo:publishToMavenCentral --no-configuration-cache
